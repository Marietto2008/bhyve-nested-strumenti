# macchina-vm13.conf -- Claude 01/11/2026. La VM Windows CLONE dedicata a WSL2-FreeBSD (vm0:13).
# Stesso formato di macchina.conf (chiave=valore, si LEGGE con sed). Differenze dalla vm0:12: immagine clonata,
# NESSUN disco dati (il WD Elements resta solo della vm0:12), tap13, VNC 5913.
vm=vm0:13
# disco con la partizione UFS p2 che contiene l'immagine (G-DRIVE USB)
disco_immagine_ident=BE0191500218
# clone di Windows11.img verificato identico il 01/11/2026 21:35 (sha256 05c16fa5eb20...)
immagine=bhyve/img/Windows/11/Windows11-wsl2-freebsd.img
# 17/11/2026 (utente): l'immagine di lavoro e' la copia su ZFS (pool linuxulator2, piu' veloce del G-DRIVE USB), copiata
# dall'utente con l'host spento (stessa dimensione e ora 15:07:32). Se questa chiave c'e', i lanciatori usano QUESTO file;
# quella sul G-DRIVE (immagine= qui sopra) resta ferma alle 15:07 come copia di sicurezza: non avviarla senza saperlo.
# 17/11 21:2x (utente): si TORNA al G-DRIVE. Chiave commentata: i lanciatori usano immagine= qui sopra. Il pool
# linuxulator2 della copia ZFS e' un Seagate M3 Portable USB (non un disco veloce); la copia ZFS resta, con lo stato
# delle 21:24 (avvii delle 18:42 e 21:11), MA il G-DRIVE riparte dallo stato delle 15:07.
#immagine_percorso=/mnt/linuxulator2/vm/IMG/Windows11-wsl2-freebsd.img
memoria=32G
# 8 vCPU come 12-Windows-11-vm12-senza-gpu-8vp: a 2-4 vCPU WSL aveva buchi dell'orologio, a 8 spariscono (27/10)
cpu=sockets=1,cores=8,threads=1
tap=tap13
vnc=127.0.0.1:5913
# nome Windows WIN11-FBSD (rinominata il 02/11, era DESKTOP-POS2RLC come la vm0:12). Indirizzo da DHCP: oggi
# IP-WINDOWS-B; se cambia, cercarlo con `arp -an | grep 00:a0:98:a1:73:65`. NON usare "win11": e' la vm0:12.
host_windows=IP-WINDOWS-B
utente_windows=marietto
password_file=/home/marietto/.config/claude-wsl2/password-windows
